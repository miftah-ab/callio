name: callio
description: A new Flutter project for automatic SMS replies to missed calls.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI / Core
  cupertino_icons: ^1.0.6
  material_color_utilities: ^0.11.1
  google_fonts: ^6.2.1

  # State Management & DI
  flutter_riverpod: ^2.4.9
  get_it: ^7.6.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2

  # Permissions & Android
  permission_handler: ^11.3.0
  flutter_background_service: ^3.0.1
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0f172a" # Deep elegant dark slate
  color_dark: "#0f172a"
  android: true
  ios: true
