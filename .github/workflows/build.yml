name: Build Callio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Use a stable version
          channel: 'stable'

      - name: Backup custom native files
        run: |
          mkdir -p .backup_native
          cp android/app/src/main/AndroidManifest.xml .backup_native/
          cp -r android/app/src/main/kotlin/com/example/callio .backup_native/

      - name: Generate platform boilerplate
        run: flutter create --org com.example -a kotlin .

      - name: Upgrade Kotlin Version
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.0.0'/g" android/build.gradle
          fi

      - name: Restore custom native files
        run: |
          cp .backup_native/AndroidManifest.xml android/app/src/main/
          cp -r .backup_native/callio/* android/app/src/main/kotlin/com/example/callio/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons and Splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
